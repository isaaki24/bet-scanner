      - name: Guardar historial CSV en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          if [ -f historial_apuestas.csv ]; then
            git add historial_apuestas.csv
            git diff --staged --quiet || git commit -m "Actualizar historial de apuestas CSV [skip ci]"
            git push
          else
            echo "El archivo CSV aún no existe porque no ha habido apuestas, se omite el commit."
          fi

name: Bot Escáner de Apuestas

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de análisis
        env:
          ODDS_API_KEY: "0263d119deb33d2831893b185acf7b14"
          TELEGRAM_TOKEN: "8860037934:AAGerJjRrT_AD2yWp918_y5xC-I8SNj3YPm4"
          TELEGRAM_CHAT_ID: "5811357869"
        run: python Bet_scanner.py

      - name: Guardar historial CSV en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          if [ -f historial_apuestas.csv ]; then
            git add historial_apuestas.csv
            git diff --staged --quiet || git commit -m "Actualizar historial de apuestas CSV [skip ci]"
            git push
          else
            echo "El archivo CSV aún no existe, se omite el commit."
          fi
